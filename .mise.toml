# mise: https://mise.jdx.dev/
#
# `mise install` installs everything under [tools]; `mise run <task>`
# delegates to pnpm scripts in package.json.
#
# `.nvmrc` is kept in sync with the `node` pin below for tools that read
# it (editors, Volta, some CI actions), but it is NOT authoritative:
# mise's own `[tools]` table takes precedence over idiomatic version
# files. Change both together.

# Every tool is pinned to an exact version, deliberately and without
# exception — including node. This is a supply-chain rule, not a
# stability one: an upstream compromise must never be auto-downloaded.
# A blanket "pin everything, update mechanically" policy is far easier
# to review than a per-dependency judgement about which upstreams are
# trustworthy enough to float.
#
# This does NOT extend to the packages in package.json: pnpm-lock.yaml
# already pins those to an exact version and integrity hash, so pinning
# the ranges as well would add nothing and would fight dependabot.
#
# The cost is that nothing here is covered by dependabot, so these go
# stale silently. Refresh them deliberately with `mise up`, and read the
# diff.
[tools]
node = "24.19.0"
# Must match `packageManager` in package.json — corepack and mise both
# read a version and they must not disagree. Bump them together.
pnpm = "11.20.0"
# Used by `mise run audit`; must match `version:` in the workflow's
# zizmor job. Bump them together.
zizmor = "1.29.0"
# Used by `mise run lint`. actionlint shells out to shellcheck for the
# `run:` blocks in workflows, and silently skips that half if shellcheck
# is missing, so it is pinned here too rather than left to the host.
actionlint = "1.7.12"
shellcheck = "0.11.0"

[env]
_.file = { path = ".env", optional = true }

[tasks.init]
description = "Rename this template to a new project (see scripts/init.py)"
run = "python3 scripts/init.py"

[tasks.install]
description = "pnpm install --frozen-lockfile"
run = "pnpm install --frozen-lockfile"

[tasks.lint]
description = "Biome lint + format check + actionlint"
run = ["pnpm lint", "actionlint"]

[tasks.format]
description = "Biome format --write"
run = "pnpm format"

[tasks.typecheck]
description = "tsc --noEmit"
run = "pnpm typecheck"

[tasks.test]
description = "vitest run --coverage"
run = "pnpm test"

[tasks.build]
description = "tsc -p tsconfig.build.json"
run = "pnpm build"

[tasks.ci]
description = "Full CI gate"
depends = ["lint", "typecheck", "test", "build"]

# Supply-chain audit. Two halves, both needing the network, which is why
# neither is part of `ci`:
#
#   1. zizmor over the workflows and the dependabot config, using the
#      mise-pinned binary.
#   2. `pnpm audit` over the resolved dependency tree, which zizmor does
#      not look at at all.
#
# This is a deliberate SUPERSET of the `zizmor` CI job, not a mirror of
# it. `--strict-collection` (fail rather than warn on schema errors in a
# collected file) has no corresponding zizmor-action input, so it can
# only be had locally. `--collect` is left off for the same reason it is
# left off in CI: zizmor's default already collects every input kind
# including dependabot config, and `all` differs only by ignoring
# .gitignore.
#
# `pnpm audit` has no CI counterpart at all, so it runs only when someone
# types this — see the note in AGENTS.md.
#
# Without a token zizmor silently falls back to offline and skips the
# `impostor-commit` and `known-vulnerable-actions` audits, which is an
# unverified result, not a pass — so refuse to run rather than exit 0 on
# a weaker check than the name promises.
[tasks.audit]
description = "zizmor audit of workflows + dependabot config, then pnpm audit of dependencies"
run = """
set -e
GH_TOKEN=$(gh auth token 2>/dev/null) || true
if [ -z "$GH_TOKEN" ]; then
  echo "No GitHub token: run \\`gh auth login\\`. Refusing to run a" >&2
  echo "partial audit — the online audits would be silently skipped." >&2
  exit 1
fi
export GH_TOKEN
zizmor --strict-collection .
pnpm audit
"""

[tasks.ci-watch]
description = "Watch GitHub Actions CI for the current branch; exits non-zero on failure"
run = """
sleep 5
remote_url=$(git remote get-url upstream 2>/dev/null || git remote get-url origin)
repo=$(echo "$remote_url" | sed -E 's|^.*github\\.com[:/]||; s|\\.git$||')
run_id=$(gh run list --repo "$repo" --branch "$(git branch --show-current)" --limit 1 --json databaseId --jq '.[0].databaseId')
if [ -z "$run_id" ]; then echo "No run found for current branch on $repo" >&2; exit 1; fi
gh run watch --repo "$repo" --exit-status "$run_id"
"""
