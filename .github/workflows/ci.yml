name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Supersede in-flight runs for the same branch/PR; never cancel main.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  lint-and-test:
    name: Lint and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up mise
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4
        with:
          install: true
          cache: true

      - name: Cache pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-

      # The frozen task, not `install`: a package.json change that
      # pnpm-lock.yaml does not reflect must fail here rather than be
      # silently re-resolved on the runner.
      - name: Install dependencies
        run: mise run install-frozen

      # The same four checks as `mise run ci`, but run sequentially and as
      # separate steps. `mise run ci` uses `depends`, which runs them
      # concurrently and aborts siblings on the first failure, so it can
      # attribute a failure to the wrong task; this ordering reports the
      # true first failure.
      - name: Lint (Biome + actionlint)
        run: mise run lint

      - name: Typecheck
        run: mise run typecheck

      - name: Test
        run: mise run test

      - name: Build
        run: mise run build

  vuln:
    name: Dependency vulnerability scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up mise
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4
        with:
          install: true
          cache: true

      - name: Install dependencies
        run: mise run install-frozen

      # Its own job, and new: `pnpm audit` previously lived only inside
      # `mise run audit`, behind a GitHub-token gate it does not need, and
      # nothing in CI called it — so the dependency scan ran nowhere
      # automatic. A separate job also lets a newly published advisory
      # against an unchanged tree go red without implying the code broke.
      - name: Audit dependencies (pnpm audit)
        run: mise run vuln

  zizmor:
    name: Zizmor (GitHub Actions audit)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Audit GitHub Actions workflows (zizmor)
        uses: zizmorcore/zizmor-action@3dc1ecc9bcb9e94e9b2c709687979e1298497054 # v0.6.2
        with:
          advanced-security: false
          # The action defaults this to "latest". Pin it so a zizmor
          # release cannot turn CI red on its own, and keep it in step
          # with the `zizmor` entry in .mise.toml — bump them together.
          version: "1.29.0"
          # `collect` is deliberately left at the action's default.
          # zizmor's `default` and `all` collect the same kinds of input
          # — workflows, action definitions, dependabot and pre-commit
          # config — and differ only in whether .gitignore is honoured.
          # `default` already audits .github/dependabot.yml here, and
          # `all` would additionally walk gitignored trees such as
          # node_modules/, which is the wrong direction.
